services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sverka
      POSTGRES_PASSWORD: sverka
      POSTGRES_DB: sverka
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sverka"]
      interval: 5s
      retries: 10

  minio:
    image: &silo_image docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sverka
      MINIO_ROOT_PASSWORD: sverka-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  minio-init:
    image: *silo_image
    depends_on: [minio]
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mcli alias set local http://minio:9000 sverka sverka-secret; do sleep 1; done
        mcli mb --ignore-existing local/sverka-imports

  backend:
    build: ./backend
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    environment:
      SVERKA_DATABASE_URL: postgresql+psycopg://sverka:sverka@postgres:5432/sverka
      SVERKA_S3_ENDPOINT_URL: http://minio:9000
      SVERKA_SECRET_KEY: ${SVERKA_SECRET_KEY:-dev-secret-change-me}
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
    environment:
      SVERKA_BACKEND_URL: http://backend:8000
      # локально по http: cookie сессии без флага Secure. В проде за HTTPS убрать.
      SVERKA_INSECURE_COOKIE: "1"
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
  minio:
