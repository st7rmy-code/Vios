services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sverka
      POSTGRES_PASSWORD: sverka
      POSTGRES_DB: sverka
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sverka"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sverka
      MINIO_ROOT_PASSWORD: sverka-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 sverka sverka-secret; do sleep 1; done;
             mc mb --ignore-existing local/sverka-imports"

  backend:
    build: ./backend
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    environment:
      SVERKA_DATABASE_URL: postgresql+psycopg://sverka:sverka@postgres:5432/sverka
      SVERKA_S3_ENDPOINT_URL: http://minio:9000
      SVERKA_SECRET_KEY: ${SVERKA_SECRET_KEY:-dev-secret-change-me}
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      args:
        SVERKA_BACKEND_URL: http://backend:8000
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
  minio:
